name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slopsidian-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install JavaScript build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish and verify the WASM site
        shell: pwsh
        run: |
          npm run build:web -- --base=/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run verify:web -- --base=/
      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-site
          path: .runtime/web/wwwroot
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: github-pages-site
          path: .runtime/web/wwwroot
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: .runtime/web/wwwroot
          single-commit: true
